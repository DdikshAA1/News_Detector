[project]
name = "fake-news-detector"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
description = "Fake news detection web app using Flask, scikit-learn, and NLTK."
authors = [ { name = "Fake News Detector", email = "noreply@example.com" } ]
readme = "README.md"
license = { text = "MIT" }
keywords = ["fake news", "flask", "machine learning", "vercel"]

[project.dependencies]
flask = "3.0.3"
scikit-learn = "1.5.2"
pandas = "2.2.3"
nltk = "3.9.1"
numpy = "2.1.3"
gunicorn = "23.0.0"
duckduckgo-search = ">=7.0.0"
